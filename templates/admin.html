<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Bot — Admin Panel</title>
    <meta name="description" content="Admin dashboard for Amazon In-Stock Telegram Bot">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ─── Design System ─────────────────────────────────────────── */
        :root {
            --bg-primary: #06060f;
            --bg-secondary: #0c0c1d;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --bg-glass: rgba(255, 255, 255, 0.04);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);

            --text-primary: #e8eaf0;
            --text-secondary: #8892a4;
            --text-muted: #505868;

            --accent-blue: #4f8fff;
            --accent-purple: #8b5cf6;
            --accent-indigo: #6366f1;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-cyan: #06b6d4;

            --gradient-primary: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            --gradient-card: linear-gradient(145deg, rgba(99,102,241,0.08), rgba(139,92,246,0.04));
            --gradient-green: linear-gradient(135deg, #22c55e, #16a34a);
            --gradient-red: linear-gradient(135deg, #ef4444, #dc2626);
            --gradient-bg: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.08) 0%, transparent 50%),
                           radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.06) 0%, transparent 50%),
                           radial-gradient(ellipse at 50% 80%, rgba(6,182,212,0.04) 0%, transparent 50%);

            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 20px rgba(99,102,241,0.15);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;

            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        /* ─── Reset & Base ──────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { font-size: 15px; scroll-behavior: smooth; }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--gradient-bg);
            z-index: -1;
            pointer-events: none;
        }

        /* ─── Animations ────────────────────────────────────────────── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(99,102,241,0.2); }
            50% { box-shadow: 0 0 20px rgba(99,102,241,0.4); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .animate-in { animation: fadeInUp 0.5s ease-out both; }

        /* ─── Login Screen ──────────────────────────────────────────── */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.6s ease-out;
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }

        .login-logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-indigo);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
            background: rgba(255,255,255,0.06);
        }

        .form-input::placeholder { color: var(--text-muted); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99,102,241,0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
            border: 1px solid var(--border-glass);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--border-hover);
        }

        .btn-danger {
            background: rgba(239,68,68,0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239,68,68,0.2);
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background: rgba(239,68,68,0.2);
        }

        .login-error {
            color: var(--accent-red);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }

        /* ─── Dashboard ─────────────────────────────────────────────── */
        #dashboard {
            display: none;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(6,6,15,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-brand .icon { font-size: 1.6rem; }

        .topbar-brand h1 {
            font-size: 1.15rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar-brand .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-live {
            background: rgba(34,197,94,0.12);
            color: var(--accent-green);
            border: 1px solid rgba(34,197,94,0.2);
        }

        .badge-live .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s ease-in-out infinite;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px;
        }

        /* ─── Stat Cards ────────────────────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-card:hover::before { opacity: 1; }

        .stat-card .stat-icon {
            font-size: 1.5rem;
            margin-bottom: 12px;
            display: block;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .stat-card .stat-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .stat-value.green { color: var(--accent-green); }
        .stat-value.blue { color: var(--accent-blue); }
        .stat-value.purple { color: var(--accent-purple); }
        .stat-value.cyan { color: var(--accent-cyan); }

        /* ─── Content Grid ──────────────────────────────────────────── */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            margin-bottom: 28px;
        }

        @media (max-width: 1024px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border-glass);
        }

        .panel-header h2 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-body {
            padding: 0;
            max-height: 520px;
            overflow-y: auto;
        }

        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-track { background: transparent; }
        .panel-body::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 4px; }

        /* ─── User List ─────────────────────────────────────────────── */
        .user-group {
            border-bottom: 1px solid var(--border-glass);
        }

        .user-group:last-child { border-bottom: none; }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 22px;
            background: rgba(255,255,255,0.02);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .user-header:hover { background: rgba(255,255,255,0.04); }

        .user-header .user-id {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-header .user-id .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .user-header .user-id span {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .user-header .url-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.04);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .url-list {
            padding: 0;
        }

        .url-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 22px 10px 64px;
            border-top: 1px solid rgba(255,255,255,0.03);
            transition: background 0.15s ease;
            gap: 12px;
        }

        .url-item:hover { background: rgba(255,255,255,0.02); }

        .url-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .stock-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .stock-dot.green { background: var(--accent-green); box-shadow: 0 0 6px rgba(34,197,94,0.4); }
        .stock-dot.red { background: var(--accent-red); box-shadow: 0 0 6px rgba(239,68,68,0.4); }
        .stock-dot.gray { background: var(--text-muted); }

        .url-text {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .url-text a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .url-text a:hover { color: var(--accent-blue); }

        /* ─── Activity Feed ─────────────────────────────────────────── */
        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 22px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            animation: slideInLeft 0.3s ease-out both;
            transition: background 0.15s ease;
        }

        .activity-item:hover { background: rgba(255,255,255,0.02); }

        .activity-time {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
            padding-top: 2px;
            min-width: 50px;
        }

        .activity-icon {
            font-size: 0.9rem;
            flex-shrink: 0;
            padding-top: 1px;
        }

        .activity-msg {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.4;
            word-break: break-word;
        }

        /* ─── Actions Bar ───────────────────────────────────────────── */
        .actions-bar {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 18px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .actions-bar .action-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-right: 8px;
        }

        /* ─── Toast ─────────────────────────────────────────────────── */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 500;
            animation: fadeInUp 0.3s ease-out;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .toast-success {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.3);
            color: var(--accent-green);
        }

        .toast-error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: var(--accent-red);
        }

        /* ─── Empty State ───────────────────────────────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
        .empty-state p { font-size: 0.9rem; }

        /* ─── Loading Skeleton ──────────────────────────────────────── */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, rgba(255,255,255,0.06) 50%, var(--bg-card) 75%);
            background-size: 400% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        /* ─── Responsive ────────────────────────────────────────────── */
        @media (max-width: 640px) {
            .main-content { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .stat-card { padding: 18px; }
            .stat-card .stat-value { font-size: 1.5rem; }
            .topbar { padding: 12px 16px; }
            .login-card { padding: 32px 24px; }
            .url-item { padding-left: 48px; }
        }

        /* ─── Refresh indicator ─────────────────────────────────────── */
        .refresh-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .refresh-indicator .spinner {
            width: 10px; height: 10px;
            border: 2px solid var(--border-glass);
            border-top-color: var(--accent-indigo);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- ─── Login Screen ──────────────────────────────────────────────── -->
<div id="login-screen">
    <div class="login-card">
        <div class="login-logo">
            <span class="icon">🛒</span>
            <h1>Stock Bot Admin</h1>
            <p>Amazon In-Stock Monitor Dashboard</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter admin password" autocomplete="current-password" autofocus>
            </div>
            <button type="submit" class="btn btn-primary">
                🔓 Sign In
            </button>
            <div class="login-error" id="login-error"></div>
        </form>
    </div>
</div>

<!-- ─── Dashboard ─────────────────────────────────────────────────── -->
<div id="dashboard">
    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-brand">
            <span class="icon">🛒</span>
            <h1>Stock Bot</h1>
            <span class="badge badge-live"><span class="dot"></span> LIVE</span>
        </div>
        <div class="topbar-actions">
            <div class="refresh-indicator" id="refresh-indicator" style="display:none">
                <div class="spinner"></div>
                <span>Refreshing...</span>
            </div>
            <button class="btn btn-secondary" onclick="logout()" style="padding:8px 16px; font-size:0.82rem;">
                🚪 Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <!-- Stats Grid -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card animate-in" style="animation-delay: 0.05s">
                <span class="stat-icon">⏱️</span>
                <div class="stat-value green" id="stat-uptime">--</div>
                <div class="stat-label">Uptime</div>
                <div class="stat-sub" id="stat-status">Connecting...</div>
            </div>
            <div class="stat-card animate-in" style="animation-delay: 0.1s">
                <span class="stat-icon">👥</span>
                <div class="stat-value blue" id="stat-users">--</div>
                <div class="stat-label">Active Users</div>
                <div class="stat-sub" id="stat-users-sub">&nbsp;</div>
            </div>
            <div class="stat-card animate-in" style="animation-delay: 0.15s">
                <span class="stat-icon">🔗</span>
                <div class="stat-value purple" id="stat-urls">--</div>
                <div class="stat-label">Tracked URLs</div>
                <div class="stat-sub" id="stat-last-check">Last check: --</div>
            </div>
            <div class="stat-card animate-in" style="animation-delay: 0.2s">
                <span class="stat-icon">🌐</span>
                <div class="stat-value cyan" id="stat-proxies">--</div>
                <div class="stat-label">Proxies Active</div>
                <div class="stat-sub" id="stat-interval">Interval: --</div>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="content-grid">
            <!-- Users Panel -->
            <div class="panel animate-in" style="animation-delay: 0.25s">
                <div class="panel-header">
                    <h2>📋 Users & Products</h2>
                    <span class="refresh-indicator" id="users-refresh" style="display:none">
                        <div class="spinner"></div>
                    </span>
                </div>
                <div class="panel-body" id="users-panel">
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <p>Loading users...</p>
                    </div>
                </div>
            </div>

            <!-- Activity Feed -->
            <div class="panel animate-in" style="animation-delay: 0.3s">
                <div class="panel-header">
                    <h2>📡 Activity Feed</h2>
                    <button class="btn btn-danger" onclick="clearLogs()" style="font-size:0.72rem; padding:4px 10px;">Clear</button>
                </div>
                <div class="panel-body" id="activity-panel">
                    <div class="empty-state">
                        <span class="icon">📡</span>
                        <p>No activity yet</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions Bar -->
        <div class="actions-bar animate-in" style="animation-delay: 0.35s">
            <span class="action-label">⚙️ Actions</span>
            <button class="btn btn-secondary" onclick="refreshAll()" style="padding:10px 18px; font-size:0.82rem;">
                🔄 Refresh Data
            </button>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
    // ─── State ────────────────────────────────────────────────────────
    let authToken = localStorage.getItem('admin_token') || null;
    let refreshTimer = null;
    const REFRESH_INTERVAL = 10000; // 10 seconds

    // ─── API Helper ──────────────────────────────────────────────────
    async function api(method, path, body = null) {
        const opts = {
            method,
            headers: {
                'Content-Type': 'application/json',
            },
        };
        if (authToken) {
            opts.headers['Authorization'] = `Bearer ${authToken}`;
        }
        if (body) {
            opts.body = JSON.stringify(body);
        }
        const res = await fetch(path, opts);
        const data = await res.json();
        if (res.status === 401 && path !== '/api/login') {
            showLogin();
            throw new Error('Unauthorized');
        }
        if (!res.ok) {
            throw new Error(data.error || 'Request failed');
        }
        return data;
    }

    // ─── Toast Notifications ─────────────────────────────────────────
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-10px)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ─── Auth ────────────────────────────────────────────────────────
    function showLogin() {
        authToken = null;
        localStorage.removeItem('admin_token');
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
        if (refreshTimer) clearInterval(refreshTimer);
    }

    function showDashboard() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        refreshAll();
        refreshTimer = setInterval(refreshAll, REFRESH_INTERVAL);
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = document.getElementById('password').value;
        const errEl = document.getElementById('login-error');
        errEl.textContent = '';

        try {
            const data = await api('POST', '/api/login', { password: pw });
            authToken = data.token;
            localStorage.setItem('admin_token', authToken);
            showDashboard();
        } catch (err) {
            errEl.textContent = '❌ Invalid password. Try again.';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    });

    async function logout() {
        try { await api('POST', '/api/logout'); } catch(e) {}
        showLogin();
    }

    // ─── Data Fetching ───────────────────────────────────────────────
    function formatUptime(seconds) {
        if (!seconds && seconds !== 0) return '--';
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        if (d > 0) return `${d}d ${h}h ${m}m`;
        if (h > 0) return `${h}h ${m}m`;
        return `${m}m`;
    }

    function formatTimeAgo(seconds) {
        if (seconds === null || seconds === undefined) return 'Never';
        if (seconds < 60) return 'Just now';
        const m = Math.floor(seconds / 60);
        if (m < 60) return `${m}m ago`;
        const h = Math.floor(m / 60);
        return `${h}h ${m % 60}m ago`;
    }

    async function fetchStats() {
        try {
            const data = await api('GET', '/api/stats');
            document.getElementById('stat-uptime').textContent = formatUptime(data.uptime_seconds);
            document.getElementById('stat-status').textContent = '🟢 Running';
            document.getElementById('stat-users').textContent = data.total_users;
            document.getElementById('stat-users-sub').innerHTML = '&nbsp;';
            document.getElementById('stat-urls').textContent = data.total_urls;
            document.getElementById('stat-last-check').textContent = `Last check: ${formatTimeAgo(data.last_check_ago)}`;
            document.getElementById('stat-proxies').textContent = data.proxy_count;
            document.getElementById('stat-interval').textContent = `Interval: ${Math.floor(data.check_interval / 60)}min`;
        } catch (e) {
            // Silently fail
        }
    }

    function extractASIN(url) {
        const match = url.match(/\/dp\/([A-Z0-9]{10})/i);
        return match ? match[1] : url.split('/').pop().substring(0, 12);
    }

    async function fetchUsers() {
        try {
            const data = await api('GET', '/api/users');
            const panel = document.getElementById('users-panel');
            const users = data.users;
            const userIds = Object.keys(users);

            if (userIds.length === 0) {
                panel.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <p>No users yet</p>
                    </div>`;
                return;
            }

            let html = '';
            for (const chatId of userIds) {
                const urls = users[chatId];
                const initials = chatId.slice(-2);
                html += `
                    <div class="user-group">
                        <div class="user-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
                            <div class="user-id">
                                <div class="avatar">${initials}</div>
                                <span>${chatId}</span>
                            </div>
                            <div style="display:flex;align-items:center;gap:8px">
                                <span class="url-count">${urls.length} URL${urls.length !== 1 ? 's' : ''}</span>
                                <button class="btn btn-danger" onclick="event.stopPropagation(); removeUser('${chatId}')" title="Remove user">✕</button>
                            </div>
                        </div>
                        <div class="url-list">`;

                for (const item of urls) {
                    const dotClass = item.in_stock === true ? 'green' : item.in_stock === false ? 'red' : 'gray';
                    const statusText = item.in_stock === true ? 'In Stock' : item.in_stock === false ? 'Out of Stock' : 'Unknown';
                    const asin = extractASIN(item.url);
                    html += `
                        <div class="url-item">
                            <div class="url-info">
                                <span class="stock-dot ${dotClass}" title="${statusText}"></span>
                                <span class="url-text"><a href="${item.url}" target="_blank" title="${item.url}">${asin}</a></span>
                            </div>
                            <button class="btn btn-danger" onclick="removeUrl('${chatId}', '${item.url.replace(/'/g, "\\'")}')" title="Remove URL">✕</button>
                        </div>`;
                }

                html += `</div></div>`;
            }

            panel.innerHTML = html;
        } catch (e) {
            // Silently fail
        }
    }

    function getActivityIcon(type) {
        const icons = {
            'in_stock': '🟢',
            'out_of_stock': '🔴',
            'blocked': '🛡️',
            'error': '⚠️',
            'check': '✅',
            'info': 'ℹ️',
        };
        return icons[type] || '📌';
    }

    async function fetchLogs() {
        try {
            const data = await api('GET', '/api/logs?limit=50');
            const panel = document.getElementById('activity-panel');

            if (data.logs.length === 0) {
                panel.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📡</span>
                        <p>No activity yet</p>
                    </div>`;
                return;
            }

            let html = '';
            for (const log of data.logs) {
                const time = new Date(log.time);
                const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="activity-item">
                        <span class="activity-time">${timeStr}</span>
                        <span class="activity-icon">${getActivityIcon(log.type)}</span>
                        <span class="activity-msg">${escapeHtml(log.message)}</span>
                    </div>`;
            }

            panel.innerHTML = html;
        } catch (e) {
            // Silently fail
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ─── Actions ─────────────────────────────────────────────────────
    async function refreshAll() {
        const indicator = document.getElementById('refresh-indicator');
        indicator.style.display = 'flex';
        await Promise.all([fetchStats(), fetchUsers(), fetchLogs()]);
        setTimeout(() => { indicator.style.display = 'none'; }, 500);
    }

    async function removeUrl(chatId, url) {
        if (!confirm(`Remove this URL from user ${chatId}'s watchlist?`)) return;
        try {
            await api('POST', '/api/remove-url', { chat_id: chatId, url });
            showToast('URL removed successfully');
            fetchUsers();
            fetchStats();
        } catch (e) {
            showToast('Failed to remove URL', 'error');
        }
    }

    async function removeUser(chatId) {
        if (!confirm(`Remove user ${chatId} and all their URLs?`)) return;
        try {
            await api('POST', '/api/remove-user', { chat_id: chatId });
            showToast('User removed successfully');
            fetchUsers();
            fetchStats();
        } catch (e) {
            showToast('Failed to remove user', 'error');
        }
    }

    async function clearLogs() {
        try {
            await api('POST', '/api/clear-logs');
            showToast('Logs cleared');
            fetchLogs();
        } catch (e) {
            showToast('Failed to clear logs', 'error');
        }
    }

    // ─── Init ────────────────────────────────────────────────────────
    (async function init() {
        if (authToken) {
            // Try to verify existing token
            try {
                await api('GET', '/api/stats');
                showDashboard();
            } catch (e) {
                showLogin();
            }
        } else {
            showLogin();
        }
    })();
</script>

</body>
</html>
